<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bug Smash</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>BUG<span>SMASH</span></h1>
      <p class="tagline">Production la bugs. Smash them. Features ah thodaadha.</p>
    </header>

    <section class="stats">
      <div class="stat"><span class="label">Score</span><span id="score">0</span></div>
      <div class="stat"><span class="label">Time</span><span id="time">30</span></div>
      <div class="stat"><span class="label">Combo</span><span id="combo">x1</span></div>
      <div class="stat"><span class="label">Best</span><span id="best">0</span></div>
    </section>

    <section class="board" id="board"></section>

    <p class="msg" id="msg">Ready ah? Start-a click pannu.</p>
    <button class="btn" id="startBtn">Start Game</button>
    <p class="hint">🐛 +10 &nbsp;·&nbsp; ✨ −15 &nbsp;·&nbsp; 3 streak = combo up</p>
  </main>
  <script src="game.js"></script>
</body>
</html>
